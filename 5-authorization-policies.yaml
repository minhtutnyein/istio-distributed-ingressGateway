# ============================================================
# 5-authorization-policies.yaml
# Purpose:  AuthorizationPolicies enforce RBAC at the service level.
#           Only the Istio IngressGateway (istio-system) and the correct
#           upstream service may call each downstream service.
#
# Call chains:
#   retail-banking: IngressGW → customer-profile-svc → account-svc → bank-statement-svc
#   payments:       IngressGW → transfer-svc → payment-gateway-svc → fx-svc
#   grc:            IngressGW → fraud-svc → audit-svc → sanction-svc
# ============================================================

# ── retail-banking ──────────────────────────────────────────
# customer-profile-svc: only retail-banking-ingressgateway pod may call it (entry point)
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-customer-profile-svc
  namespace: retail-banking
spec:
  selector:
    matchLabels:
      app: customer-profile-svc
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/retail-banking/sa/retail-banking-ingressgateway"
---
# account-svc: only customer-profile-svc may call it
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-account-svc
  namespace: retail-banking
spec:
  selector:
    matchLabels:
      app: account-svc
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/retail-banking/sa/customer-profile-svc"
---
# bank-statement-svc: only account-svc may call it
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-bank-statement-svc
  namespace: retail-banking
spec:
  selector:
    matchLabels:
      app: bank-statement-svc
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/retail-banking/sa/account-svc"

# ── payments ────────────────────────────────────────────────
