# ============================================================
# apps/payments/virtualservice.yaml
# Purpose:  VirtualService bound to payments-gateway.
#           Routes entry traffic from namespace IngressGateway to
#           transfer-svc with timeout + retry policy.
# Call chain: payments-ingressgateway → transfer-svc → payment-gateway-svc → fx-svc
# ============================================================
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: payments-vs
  namespace: payments
spec:
  hosts:
    - "finance.mhnbank.xyz"
  gateways:
    - payments-gateway
  http:
    - route:
        - destination:
            host: transfer-svc
            port:
              number: 7071
      timeout: 15s
      retries:
        attempts: 3
        perTryTimeout: 5s
        retryOn: gateway-error,connect-failure,retriable-4xx
