# ============================================================
# apps/keycloak/keycloak.yaml
# Purpose:  Keycloak Identity Provider — official image, dev mode.
#
# Image:    quay.io/keycloak/keycloak:24.0.5  (no Bitnami dependency)
# Mode:     start-dev (H2 in-memory database — demo only)
#           Use a StatefulSet + PostgreSQL for production.
# Realm:    imported on startup from the keycloak-realm-import ConfigMap
#           (apps/keycloak/realm-import.yaml) via --import-realm flag.
# ============================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
        app.kubernetes.io/name: keycloak
    spec:
      serviceAccountName: keycloak
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0.5
          args:
            - start-dev
            - --import-realm
          env:
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "Admin@MHNBank2025"
            # KC_PROXY=edge: trust X-Forwarded-* headers from Istio IngressGateway
            - name: KC_PROXY
              value: "edge"
            # Advertise auth.mhnbank.xyz in OIDC metadata so browser redirects
            # point to the correct public hostname.  OAuth2 Proxy reaches
            # Keycloak via in-cluster DNS; KC_HOSTNAME_STRICT=false lets it
            # accept requests on any hostname.
            - name: KC_HOSTNAME_URL
              value: "http://auth.mhnbank.xyz"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080