# ============================================================
# apps/risk-compliance/virtualservice.yaml
# Purpose:  VirtualService bound to grc-gateway.
#           Routes entry traffic from namespace IngressGateway to
#           fraud-svc with timeout + retry policy.
# Call chain: grc-ingressgateway → fraud-svc → audit-svc → sanction-svc
# ============================================================
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grc-vs
  namespace: grc
spec:
  hosts:
    - "finance.mhnbank.xyz"
  gateways:
    - grc-gateway
  http:
    - route:
        - destination:
            host: fraud-svc
            port:
              number: 6061
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
