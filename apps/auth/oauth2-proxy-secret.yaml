# ============================================================
# apps/auth/oauth2-proxy-secret.yaml
# Purpose:  Secret holding OAuth2 Proxy credentials.
#
# IMPORTANT: Replace placeholder values before deploying.
#
# How to generate a 32-byte raw cookie secret:
#   python3 -c "import random,string; \
#     print(''.join(random.choices(string.ascii_letters+string.digits+'!@#$%^&*',k=32)))"
#
# NOTE: OAuth2 Proxy v7.6.0 reads OAUTH2_PROXY_COOKIE_SECRET as raw bytes from the
# environment variable — it does NOT base64-decode it. The value must be exactly
# 16, 24, or 32 characters long.
#
# client-secret must match the Keycloak client secret for
# the "oauth2-proxy-client" client in the "mhnbank" realm.
#
# In production use an ExternalSecret or Sealed Secret — never
# commit real credentials to version control.
# ============================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secret
  namespace: auth
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_SECRET: "changeme-keycloak-client-secret"
  # Exactly 32 raw characters — used as-is by OAuth2 Proxy v7.6.0 (no base64 decode)
  OAUTH2_PROXY_COOKIE_SECRET: "MHNBankCookieSecret2025Change!!!"