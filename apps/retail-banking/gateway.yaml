# ============================================================
# apps/retail-banking/gateway.yaml
# Purpose:  Namespace-scoped Istio Gateway bound to the
#           retail-banking-ingressgateway pod (ClusterIP).
#           Receives mTLS traffic forwarded by the global gateway
#           on port 80 (URI already rewritten to /).
# ============================================================
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: retail-banking-gateway
  namespace: retail-banking
spec:
  selector:
    istio: retail-banking-ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "finance.mhnbank.xyz"
