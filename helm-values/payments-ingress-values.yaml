# ============================================================
# helm-values/payments-ingress-values.yaml
# Purpose:  Helm values for the payments namespace
#           IngressGateway (istio/gateway chart).
#           This gateway is internal-only (ClusterIP) and
#           receives traffic forwarded by the global gateway.
#
# Install:
#   helm install payments-ingressgateway istio/gateway \
#     -n payments \
#     -f helm-values/payments-ingress-values.yaml
# ============================================================

# Internal ClusterIP — not exposed to the internet
service:
  type: ClusterIP
  ports:
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: false

# Labels must match the selector in apps/payments/gateway.yaml
labels:
  istio: payments-ingressgateway
  app: payments-ingressgateway
