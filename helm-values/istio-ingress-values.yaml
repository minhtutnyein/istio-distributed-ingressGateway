# ============================================================
# helm-values/istio-ingress-values.yaml
# Purpose:  Helm values for istio/gateway — the IngressGateway
#           (replaces the single Global KIC LoadBalancer).
#
# Install:
#   helm install istio-ingressgateway istio/gateway \
#     -n istio-system \
#     -f helm-values/istio-ingress-values.yaml
# ============================================================

# Single LoadBalancer — the only internet-facing entry point
service:
  type: LoadBalancer
  ports:
    - name: http2
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443

# Pod resource sizing
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3

# Pod labels so Istio Gateway resource selector matches
labels:
  istio: ingressgateway
  app: istio-ingressgateway

