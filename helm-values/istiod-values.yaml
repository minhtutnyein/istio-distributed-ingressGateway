# ============================================================
# helm-values/istiod-values.yaml
# Purpose:  Helm values for istio/istiod — the Istio control plane.
#
# Install:
#   helm install istiod istio/istiod -n istio-system \
#     -f helm-values/istiod-values.yaml --wait
# ============================================================

global:
  # SPIFFE trust domain — must match istio-base
  trustDomain: "cluster.local"

  # Sidecar proxy resource sizing for EKS
  proxy:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

pilot:
  autoscaleEnabled: true
  autoscaleMin: 1
  autoscaleMax: 3

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Enable Kubernetes Service Account token projection for SPIFFE/X.509
  env:
    PILOT_ENABLE_WORKLOAD_ENTRY_AUTOREGISTRATION: "true"

meshConfig:
  # Enforce mTLS across the mesh — PeerAuthentication STRICT takes effect
  enableAutoMtls: true
  accessLogFile: /dev/stdout
  enableTracing: false

  # ── External Authorization Provider (OAuth2 Proxy) ───────
  # Registers OAuth2 Proxy as the ext_authz backend for the
  # AuthorizationPolicy with action: CUSTOM in 6-api-access-control.yaml.
  #
  # Envoy sends an HTTP check request to OAuth2 Proxy on port 4180.
  # headersToUpstreamOnAllow: forwarded to upstream on 200 OK response.
  # headersToDownstreamOnDeny: forwarded to the client on deny/redirect.
  # includeRequestHeadersInCheck: original request headers sent to OAuth2 Proxy.
  extensionProviders:
    - name: oauth2-proxy
      envoyExtAuthzHttp:
        service: oauth2-proxy.auth.svc.cluster.local
        port: 4180
        headersToUpstreamOnAllow:
          - authorization
          - cookie
          - x-auth-request-access-token
          - x-auth-request-user
          - x-auth-request-email
          - x-forwarded-access-token
        headersToDownstreamOnDeny:
          - content-type
          - set-cookie
          - location
        includeRequestHeadersInCheck:
          - authorization
          - cookie
