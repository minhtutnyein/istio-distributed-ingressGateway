# ============================================================
# 3-global-virtualservice.yaml
# Purpose:  Two-tier routing — global IngressGateway forwards to
#           per-namespace IngressGateways based on:
#             1. JWT domain claim  (API / machine clients)
#             2. URL path prefix   (browser / OAuth2 Proxy clients)
#
# JWT routing (new):
#   API client obtains a Bearer JWT from Keycloak using the
#   client-credentials grant for one of the domain API clients
#   (retail-banking-api, payments-api, grc-api).  The JWT
#   carries a hardcoded 'domain' claim.  Istio's
#   RequestAuthentication (7-request-authentication.yaml)
#   validates the token and makes @request.auth.claims.domain
#   available for header matching in this VirtualService.
#
#   Flow:  curl -H "Authorization: Bearer <jwt>" https://finance.mhnbank.xyz/
#           → matched by domain claim → routed to namespace gateway → app
#
# Path routing (existing):
#   Browser users authenticated via OAuth2 Proxy use the path
#   prefix to reach the correct domain namespace.
#
#   Flow:  browser → /retail-banking/ → retail-banking gateway → app
# ============================================================
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: global-virtualservice
  namespace: istio-system
spec:
  hosts:
    - "finance.mhnbank.xyz"
  gateways:
    - global-istio-gateway
  http:
    # ── Tier 1: JWT claim routing (API / machine clients) ────
    # Evaluated first.  RequestAuthentication extracts the
    # 'domain' claim from a valid Bearer JWT into the
    # @request.auth.claims.domain header.
    # No path prefix is required — clients call / directly.
    - name: "jwt-retail-banking"
      match:
        - headers:
            "@request.auth.claims.domain":
              exact: retail-banking
      rewrite:
        uri: /
      route:
        - destination:
            host: retail-banking-ingressgateway.retail-banking.svc.cluster.local
            port:
              number: 80

    - name: "jwt-payments"
      match:
        - headers:
            "@request.auth.claims.domain":
              exact: payments
      rewrite:
        uri: /
      route:
        - destination:
            host: payments-ingressgateway.payments.svc.cluster.local
            port:
              number: 80

    - name: "jwt-grc"
      match:
        - headers:
            "@request.auth.claims.domain":
              exact: grc
      rewrite:
        uri: /
      route:
        - destination:
            host: grc-ingressgateway.grc.svc.cluster.local
            port:
              number: 80

    # ── Tier 2: Path-prefix routing (browser / OAuth2 clients) ──
    # Redirect no-trailing-slash URLs to canonical paths.
    - match:
        - uri:
            exact: /retail-banking
      redirect:
        uri: /retail-banking/

    - match:
        - uri:
            exact: /payments
      redirect:
        uri: /payments/

    - match:
        - uri:
            exact: /grc
      redirect:
        uri: /grc/

    # /retail-banking/* → retail-banking namespace IngressGateway
    - match:
        - uri:
            prefix: /retail-banking/
      rewrite:
        uri: /
      route:
        - destination:
            host: retail-banking-ingressgateway.retail-banking.svc.cluster.local
            port:
              number: 80

    # /payments/* → payments namespace IngressGateway
    - match:
        - uri:
            prefix: /payments/
      rewrite:
        uri: /
      route:
        - destination:
            host: payments-ingressgateway.payments.svc.cluster.local
            port:
              number: 80

    # /grc/* → grc namespace IngressGateway
    - match:
        - uri:
            prefix: /grc/
      rewrite:
        uri: /
      route:
        - destination:
            host: grc-ingressgateway.grc.svc.cluster.local
            port:
              number: 80

    # /oauth2/* → OAuth2 Proxy (callback + sign-in/sign-out endpoints)
    # This route MUST come before the catch-all.
    # The OAuth2 Proxy callback (/oauth2/callback) receives the
    # authorization code from Keycloak (step 10-12 in the auth flow).
    - match:
        - uri:
            prefix: /oauth2/
      route:
        - destination:
            host: oauth2-proxy.auth.svc.cluster.local
            port:
              number: 4180

    # Catch-all: return 200 for all unmatched paths (/, /favicon.ico, scanners, etc.)
    # Prevents 404 NR route_not_found from polluting Kiali traffic health.
    - match:
        - uri:
            prefix: /
      directResponse:
        status: 200
        body:
          string: "MHN Bank API Gateway"