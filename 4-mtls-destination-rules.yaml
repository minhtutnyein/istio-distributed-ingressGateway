# ============================================================
# 4-mtls-destination-rules.yaml
# Purpose:  DestinationRules instruct Envoy sidecars to use mTLS
#           when initiating connections to each service.
#           Combined with PeerAuthentication STRICT (file
#           2-downstream-proxy-services.yaml), this enforces
#           mutual TLS in both directions for every service.
#
# SPIFFE identity format (auto-issued by istiod):
#   spiffe://<trust-domain>/ns/<namespace>/sa/<serviceaccount>
# ============================================================

# ── retail-banking ──────────────────────────────────────────
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: account-svc-dr
  namespace: retail-banking
spec:
  host: account-svc.retail-banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: bank-statement-svc-dr
  namespace: retail-banking
spec:
  host: bank-statement-svc.retail-banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: customer-profile-svc-dr
  namespace: retail-banking
spec:
  host: customer-profile-svc.retail-banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL

